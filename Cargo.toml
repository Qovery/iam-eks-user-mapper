[package]
name = "iam-eks-user-mapper"
version = "0.6.1"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.6.1", features = ["derive", "env"] }
serde = "1.0.228"
serde_yaml = "0.9.34"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
thiserror = "2.0.18"

# Kubernetes
kube = { version = "3.1.0", default-features = false, features = [
  "runtime",
  "derive",
  "ws",
  "aws-lc-rs",
  "client",
  "rustls-tls",
  "gzip",
] }
k8s-openapi = { version = "0.27.1", default-features = false, features = [
  "v1_34",
] }
rustls = { version = "0.23.40" }

# AWS
aws-config  = { version = "1.8.16", default-features = false, features = ["default-https-client", "rt-tokio", "credentials-process", "sso"] }
aws-sdk-iam = { version = "1.108.1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sts = { version = "1.103.0", default-features = false, features = ["sigv4a", "default-https-client", "rt-tokio"] }
